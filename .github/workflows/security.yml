name: Matterhorn Security

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

  rust-security:
    name: Rust dependency security
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify locked Rust dependency policy
        run: |
          node --test scripts/rust-dependency-policy.test.mjs
          node scripts/rust-dependency-policy.mjs
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          # SQLx records its inactive MySQL/RSA option in Cargo.lock. The step
          # above fails if that unpatched crate ever enters a resolved graph.
          ignore: RUSTSEC-2023-0071
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: examples/microsandbox-openwork-rust
      - name: Compile the locked Rust example
        run: cargo check --locked --manifest-path examples/microsandbox-openwork-rust/Cargo.toml --all-targets

  repository-security-gates:
    name: Repository security gates
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
      - name: Build Crypto App SDK
        run: pnpm --filter @matterhorn-work/crypto-app-sdk build
      - name: Build approved SQLite binding
        run: pnpm --filter matterhorn-work-server rebuild better-sqlite3 --pending
      - name: Validate security workflow contract
        run: pnpm test:security-workflow-contract
      - name: Scan release scope for secrets
        run: pnpm release:secret-scan
      - name: Validate dependency audit inventory
        run: pnpm test:dependency-bulk-audit
      - name: Prove the Polymarket signing dependency is patched
        run: pnpm verify:elliptic-security-patch
      - name: Audit locked dependencies
        run: pnpm audit:dependencies
      - name: Smoke test patched release dependencies
        run: pnpm test:release-dependency-patches
      - name: Exercise auth, tenancy, and shared rate-limit controls
        run: bun test apps/server/src/auth.e2e.test.ts apps/server/src/backend-security.e2e.test.ts apps/server/src/request-rate-limit-store.test.ts --timeout 15000
      - name: Exercise executable download and runtime security regressions
        run: |
          pnpm --dir apps/orchestrator test:sidecars
          bun --no-env-file test apps/orchestrator/test/runtime-upgrade-state.test.ts apps/orchestrator/test/router-workspace-request.test.ts apps/orchestrator/test/router-daemon-error.test.ts apps/desktop/scripts/verified-opencode.test.ts
          pnpm --dir apps/opencode-router build
          node --test apps/opencode-router/test/media-store-races.test.mjs
          bun --no-env-file test apps/app/tests/message-element.test.ts apps/app/tests/tool-text.test.ts apps/app/tests/desk-task-inputs.test.ts apps/server/src/google-workspace-query.test.ts apps/server/src/google-workspace-access.test.ts apps/server/src/google-workspace-access.e2e.test.ts apps/server/src/google-workspace-launch-gate.test.ts apps/server/src/skill-hub.test.ts apps/server/src/opencode-db.test.ts apps/server/src/tokens.test.ts apps/server/src/image-generation-provider.test.ts apps/server/src/generated-image-store.test.ts apps/server/src/generated-media-routes.e2e.test.ts
          node --test apps/desktop/electron/migration-write.test.mjs apps/desktop/electron/ui-control-handler.test.mjs apps/desktop/electron/ui-control-discovery.test.mjs apps/orchestrator/test/package-install.test.mjs apps/opencode-router/test/config-path.test.js apps/opencode-router/test/slack.test.js apps/opencode-router/test/telegram.test.js apps/opencode-router/test/media-store.test.js apps/opencode-router/test/public-control-error.test.js apps/opencode-router/test/health-errors.test.js apps/opencode-router/test/messaging-agent-file.test.js qa-reports/jev/2026-09-30/local-qa-network.test.mjs scripts/lib/release-file-snapshot.test.mjs scripts/release/version-command.test.mjs scripts/workspace-user-data-recovery-files.test.mjs packages/stm-credentials/test/adapter.test.mjs
      - name: Exercise release evidence and recovery security regressions
        run: |
          node scripts/release-secret-scan.test.mjs
          node scripts/release-candidate-manifest.test.mjs
          node scripts/public-beta-owner-acceptance.test.mjs
          node scripts/workspace-user-data-recovery.test.mjs
          node scripts/workspace-backup-restore-drill.test.mjs
          node scripts/bittensor-customer-evidence-bundle.test.mjs
          node scripts/bittensor-receipt-check.test.mjs
          node scripts/generated-media-production-readiness.test.mjs
          node --test scripts/migration/02-validate-migration.test.mjs
          node scripts/billing-browser-smoke.test.mjs
          node --test scripts/lib/browser-smoke-privacy.test.mjs
          node scripts/outputs-browser-smoke.test.mjs
          node --test scripts/outputs-browser-smoke-safety.test.mjs
          node scripts/desktop-beta-first-run.test.mjs
          node scripts/bittensor-beta-customer-packet.test.mjs
          node scripts/market-official-sdk-operator-loop.test.mjs
          node scripts/monday-beta-rc-pack.test.mjs
