name: Matterhorn Security

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

  rust-security:
    name: Rust dependency security
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: examples/microsandbox-openwork-rust
      - name: Compile the locked Rust example
        run: cargo check --locked --manifest-path examples/microsandbox-openwork-rust/Cargo.toml --all-targets

  repository-security-gates:
    name: Repository security gates
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
      - name: Build approved SQLite binding
        run: pnpm --filter matterhorn-work-server rebuild better-sqlite3 --pending
      - name: Validate security workflow contract
        run: pnpm test:security-workflow-contract
      - name: Scan release scope for secrets
        run: pnpm release:secret-scan
      - name: Audit locked dependencies
        run: pnpm audit:dependencies
      - name: Exercise auth, tenancy, and shared rate-limit controls
        run: bun test apps/server/src/auth.e2e.test.ts apps/server/src/backend-security.e2e.test.ts apps/server/src/request-rate-limit-store.test.ts --timeout 15000
