name: Matterhorn Desks Tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  openwork-tests:
    name: openwork-tests (${{ matrix.check_name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the historical required-check display name while running on
          # GitHub-hosted Ubuntu when Blacksmith runners are unavailable.
          - os: ubuntu-22.04
            check_name: blacksmith-4vcpu-ubuntu-2204
          - os: macos-14
            check_name: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/opencode-bin"
          OPENCODE_INSTALL_DIR="$install_dir" bash scripts/install-pinned-opencode.sh
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify OpenCode
        run: opencode --version

      - name: Validate OpenWork and OpenCode runtime compatibility
        env:
          MATTERHORN_REQUIRE_OPENCODE_BINARY: "1"
        run: node scripts/opencode-runtime-compatibility.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Validate Electron packaging source contract
        run: pnpm test:electron-packaging-sources

      - name: Validate Electron local tester artifact helper
        run: pnpm test:electron-local-tester-artifact

      - name: Validate desktop beta first-run readiness
        run: pnpm test:desktop-beta-first-run

      - name: Validate Matterhorn brand assets
        run: pnpm test:matterhorn-brand-assets

      - name: Run e2e tests
        run: pnpm --filter @matterhorn-work/app test:e2e

  customer-crypto-gates:
    name: customer-crypto-gates
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Validate customer crypto smoke wiring
        run: pnpm test:customer-ready-crypto-smoke

      - name: Validate agent MCP crypto evidence tools
        run: pnpm test:agent-control-mcp

      - name: Run customer crypto smoke
        run: pnpm smoke:customer-ready-crypto

      - name: Write customer crypto smoke evidence
        run: node scripts/customer-ready-crypto-smoke.mjs --offline --strict --json-output /tmp/matterhorn-crypto-smoke.json

      - name: Write customer crypto smoke checksum
        run: sha256sum /tmp/matterhorn-crypto-smoke.json > /tmp/matterhorn-crypto-smoke.sha256

      - name: Upload customer crypto smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: matterhorn-crypto-smoke
          path: |
            /tmp/matterhorn-crypto-smoke.json
            /tmp/matterhorn-crypto-smoke.sha256
          if-no-files-found: error

  public-beta-container-build:
    name: public-beta-container-build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile.public-beta
          load: true
          push: false
          tags: matterhorn-public-beta:ci

      - name: Verify startup fails closed without production secrets
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          if docker run --rm matterhorn-public-beta:ci >"$output" 2>&1; then
            echo "Public Beta image started without required secrets." >&2
            exit 1
          fi
          grep -F "Public Beta startup blocked: MATTERHORN_WORK_TOKEN" "$output"

      - name: Smoke production image liveness with a persistent volume
        shell: bash
        env:
          MATTERHORN_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          container="matterhorn-public-beta-ci"
          volume="matterhorn-public-beta-ci-data"
          cleanup() {
            docker logs "$container" 2>/dev/null || true
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:18787:8787 \
            --mount "type=volume,source=$volume,target=/data" \
            --env PORT=8787 \
            --env MATTERHORN_BUILD_COMMIT="$MATTERHORN_BUILD_COMMIT" \
            --env MATTERHORN_WORK_CORS_ORIGINS=https://app.example.test \
            --env MATTERHORN_WORK_TOKEN=ci-client-token-000000000000000000000000 \
            --env MATTERHORN_WORK_HOST_TOKEN=ci-host-token-00000000000000000000000000 \
            --env MATTERHORN_WORK_TRUSTED_PROXY_SECRET=ci-proxy-secret-000000000000000000000000 \
            matterhorn-public-beta:ci >/dev/null

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18787/health/live \
              | grep -F '"status":"live"' >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
              echo "Public Beta container exited before becoming live." >&2
              exit 1
            fi
            sleep 2
          done

          echo "Public Beta container did not become live within 90 seconds." >&2
          exit 1

  matterhorn-platform-safety:
    name: matterhorn-platform-safety
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build approved SQLite binding
        run: |
          pnpm --filter matterhorn-work-server rebuild better-sqlite3 --pending
          pnpm --dir apps/server exec node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.close();"

      - name: Typecheck web app
        run: pnpm --filter @matterhorn-work/app typecheck

      - name: Typecheck backend
        run: pnpm --dir apps/server typecheck

      - name: Run full web app test suite
        run: pnpm --filter @matterhorn-work/app test

      - name: Run full backend test suite
        run: pnpm --dir apps/server test

      - name: Build public-Beta web candidate
        run: pnpm --filter @matterhorn-work/app build:web

      - name: Validate task-first bundle budget gate
        run: pnpm test:task-first-bundle-budget

      - name: Enforce task-first bundle budgets
        run: pnpm gate:task-first-bundle-budget

      - name: Validate platform safety gate wiring
        run: pnpm test:matterhorn-platform-safety-gate

      - name: Run Matterhorn platform safety gate
        run: pnpm test:matterhorn-platform-safety

      - name: Validate scheduled security scanning
        run: pnpm test:security-workflow-contract

      - name: Validate public-Beta control-plane image contract
        run: pnpm test:public-beta-container-contract

      - name: Validate same-origin Vercel proxy contract
        run: pnpm test:matterhorn-vercel-proxy

      - name: Validate production CORS readiness
        run: pnpm test:production-cors-readiness

      - name: Run production CORS readiness
        run: pnpm smoke:production-cors-readiness

      - name: Validate product readiness smoke wiring
        run: pnpm test:product-readiness-smoke
