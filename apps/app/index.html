<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Matterhorn Work is a desk-first AI workspace for Bittensor, Hyperliquid, Polymarket, longevity workflows, memory, and MCP tools with visible non-custodial safety boundaries."
    />
    <meta name="application-name" content="Matterhorn Work" />
    <meta name="theme-color" content="#0C0C0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#D1F2FF" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Matterhorn Work" />
    <meta
      property="og:description"
      content="Use Bittensor, Hyperliquid, Polymarket, longevity workflows, memory, and MCP tools through focused Matterhorn desks."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Matterhorn Work</title>

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="512x512" href="/matterhorn-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/matterhorn-logo-square.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("openwork.themePref") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body class="bg-dls-surface text-dls-text mac:bg-transparent">
    <div id="root"></div>
    <script type="module" src="/src/index.react.tsx"></script>
  </body>
</html>
