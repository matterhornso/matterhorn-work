services:
  matterhorn-host:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.microsandbox
      args:
        OPENWORK_ORCHESTRATOR_VERSION: ${MATTERHORN_WORK_VERSION:-0.13.13}
        OPENWORK_SERVER_VERSION: ${MATTERHORN_WORK_VERSION:-0.13.13}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.27}
    ports:
      - "8787:8787"
    environment:
      MATTERHORN_WORK_TOKEN: ${MATTERHORN_WORK_TOKEN:?Set MATTERHORN_WORK_TOKEN in the deployment secret manager}
      MATTERHORN_WORK_HOST_TOKEN: ${MATTERHORN_WORK_HOST_TOKEN:?Set MATTERHORN_WORK_HOST_TOKEN in the deployment secret manager}
      MATTERHORN_WORK_APPROVAL_MODE: ${MATTERHORN_WORK_APPROVAL_MODE:-manual}
      MATTERHORN_WORK_CORS_ORIGINS: ${MATTERHORN_WORK_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OPENWORK_DATA_DIR: /data/openwork-orchestrator
      OPENWORK_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
